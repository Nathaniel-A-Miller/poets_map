<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Islamic Poets — Parallels Map</title>
<style>
  :root {
    --gold: #f6ad55;
    --purple: #9f7aea;
    --ink: #1a202c;
    --muted: #4a5568;
    --bg: #f0f2f5;
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 10px 12px;
      cursor: grab;
      user-select: none;
      width: 230px;
      font-size: 14px;
  };
    --border: #e1e8ed;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
  }
  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  .tray {
    width: 290px;
    flex-shrink: 0;
    background: white;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tray h2 { margin: 0; font-size: 1.15em; }
  .tray .help {
    color: var(--muted);
    font-size: 0.85em;
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .tray-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tray-actions button {
    flex: 1;
    padding: 6px 8px;
    font-size: 0.8em;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
  }
  .tray-actions button:hover { background: #f0f2f5; }

  .map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #d9e2ec;
    touch-action: none;
  }
  .stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .stage img.map {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    max-width: none;
  }

  .zoom-controls {
    position: absolute;
    bottom: 18px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 20;
  }
  .zoom-controls button {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: white;
    font-size: 1.3em;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-family: inherit;
    color: var(--ink);
  }
  .zoom-controls button:hover { background: #f0f2f5; }

  .scale-readout {
    position: absolute;
    bottom: 18px;
    left: 18px;
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.8em;
    color: var(--muted);
    z-index: 20;
  }

  .card {
    background: var();
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 10px 12px;
    cursor: grab;
    user-select: none;
    width: 230px;
    font-size: 14px;
  }
  .card.on-map {
    position: absolute;
    z-index: 5;
    transform-origin: 0 0;
  }
  .card.on-map.expanded { z-index: 6; }
  .card.dragging {
    cursor: grabbing;
    opacity: 0.95;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    z-index: 100;
  }
  .card .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .card .name {
    font-weight: 600;
    font-size: 0.95em;
    line-height: 1.25;
    flex: 1;
  }
  .card .score-pill {
    color: white;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.82em;
    font-weight: 700;
    white-space: nowrap;
  }
  .card .id {
    font-size: 0.7em;
    color: var(--muted);
    margin-top: 4px;
    word-break: break-all;
    display: none;
  }
  .card.expanded .id { display: block; }
  .card .details {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 0.85em;
  }
  .card.expanded .details { display: block; }
  .card .row {
    display: flex;
    justify-content: space-between;
    margin: 2px 0;
  }
  .card .row b { font-weight: 600; }
  .card .section-title {
    font-weight: 600;
    margin: 8px 0 2px;
    color: var(--muted);
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .return {
    margin-top: 10px;
    padding: 5px 8px;
    font-size: 0.78em;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    width: 100%;
  }
  .card .return:hover { background: #f0f2f5; }
  .card.in-tray .return { display: none; }

  .map-area.drop-target { box-shadow: inset 0 0 0 3px var(--purple); }
</style>
</head>
<body>
<div class="app">
  <aside class="tray">
    <h2>Poets</h2>
    <p class="help">Drag a card onto the map. Click a card to expand. Wheel / pinch / buttons to zoom; drag empty map to pan.</p>
    <div class="tray-actions">
      <button id="recall-all" title="Return every card to this tray">Recall all</button>
      <button id="reset-view" title="Fit map to window">Reset view</button>
    </div>
    <div id="tray-cards"></div>
  </aside>
  <div class="map-area" id="map-area">
    <div class="stage" id="stage">
      <img class="map" src="Miller Map 1 PNG v3.png" alt="Pre-Islamic Arabia map" id="map-img">
    </div>
    <div class="scale-readout" id="scale-readout">100%</div>
    <div class="zoom-controls">
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">&minus;</button>
      <button id="zoom-fit" title="Fit map">&#9711;</button>
    </div>
  </div>
</div>
<script>
  const POETS = [
    {
      id: 'aws_ibn_hajar',
      display: 'Aws ibn Ḥajar',
      fullId: '0001AwsIbnHajar.Diwan.JK007502-ara1_poems_analysis',
      verses: 517, parallels: 257,
      types: { conceptual: 163, lexical: 81, syntactic: 13 },
      scores: { 0: 47, 1: 99, 2: 89, 3: 22 },
      sum: 343, normalized: 0.6634
    },
    {
      id: 'alqama_fahl',
      display: 'ʿAlqama al-Faḥl',
      fullId: '0001CalqamaFahl.Diwan.JK007522-ara1_poems_analysis',
      verses: 206, parallels: 70,
      types: { conceptual: 39, lexical: 30, syntactic: 1 },
      scores: { 0: 17, 1: 24, 2: 25, 3: 4 },
      sum: 86, normalized: 0.4175
    },
    {
      id: 'qays_ibn_khatim',
      display: 'Qays ibn al-Khaṭīm',
      fullId: '0001QaysIbnKhatim.Diwan.JK007527-ara1_poems_analysis',
      verses: 311, parallels: 210,
      types: { conceptual: 128, lexical: 72, syntactic: 10 },
      scores: { 0: 54, 1: 65, 2: 72, 3: 19 },
      sum: 266, normalized: 0.8553
    },
    {
      id: 'abu_dhuayb',
      display: 'Abū Dhuʾayb',
      fullId: 'abu_dhuayb_analysis',
      verses: 601, parallels: 211,
      types: { conceptual: 123, lexical: 78, syntactic: 10 },
      scores: { 0: 49, 1: 75, 2: 80, 3: 7 },
      sum: 256, normalized: 0.4260
    },
    {
      id: 'shanfara',
      display: 'al-Shanfarā',
      fullId: 'shanfara_analysis',
      verses: 287, parallels: 112,
      types: { conceptual: 76, lexical: 33, syntactic: 3 },
      scores: { 0: 39, 1: 43, 2: 25, 3: 5 },
      sum: 108, normalized: 0.3763
    },
    {
      id: 'muhalhil',
      display: 'Muhalhil ibn Rabīʿa',
      fullId: '0001MuhalhilIbnRabica.Diwan.JK007529-ara1_poems_analysis',
      verses: 346, parallels: 169,
      types: { conceptual: 94, lexical: 64, syntactic: 11 },
      scores: { 0: 85, 1: 51, 2: 29, 3: 4 },
      sum: 121, normalized: 0.3497
    }
  ];

  const STORAGE_KEY = 'parallels_map_state_v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { cards: {}, view: null };
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  const state = loadState();

  const stage = document.getElementById('stage');
  const mapArea = document.getElementById('map-area');
  const mapImg = document.getElementById('map-img');
  const tray = document.getElementById('tray-cards');
  const scaleReadout = document.getElementById('scale-readout');

  const view = state.view || { scale: 1, tx: 0, ty: 0 };
  function applyTransform() {
    stage.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
    scaleReadout.textContent = Math.round(view.scale * 100) + '%';
    const inv = 1 / view.scale;
    document.querySelectorAll('.card.on-map').forEach(c => {
      c.style.transform = `scale(${inv})`;
    });
  }
  function persistView() {
    state.view = { scale: view.scale, tx: view.tx, ty: view.ty };
    saveState();
  }
  applyTransform();

  function scoreColor(n) {
    if (n >= 0.7) return '#38a169';
    if (n >= 0.5) return '#dd6b20';
    if (n >= 0.35) return '#d69e2e';
    return '#a0522d';
  }

  function makeCard(poet) {
    const card = document.createElement('div');
    card.className = 'card in-tray';
    card.dataset.id = poet.id;
    const typesHtml = Object.entries(poet.types).map(
      ([k,v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`
    ).join('');
    const scoresHtml = Object.entries(poet.scores).map(
      ([k,v]) => `<div class="row"><span>score ${k}</span><b>${v}</b></div>`
    ).join('');
    card.innerHTML = `
      <div class="head">
        <div class="name">${poet.display}</div>
        <div class="score-pill" style="background:${scoreColor(poet.normalized)}">${poet.normalized.toFixed(3)}</div>
      </div>
      <div class="id">${poet.fullId}</div>
      <div class="details">
        <div class="row"><span>Total verses</span><b>${poet.verses}</b></div>
        <div class="row"><span>Total parallels</span><b>${poet.parallels}</b></div>
        <div class="row"><span>Score sum</span><b>${poet.sum}</b></div>
        <div class="row"><span>Normalized</span><b>${poet.normalized.toFixed(4)}</b></div>
        <div class="section-title">Type breakdown</div>
        ${typesHtml}
        <div class="section-title">Score distribution</div>
        ${scoresHtml}
        <button class="return" type="button">↩ Return to tray</button>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (card._justDragged) { card._justDragged = false; return; }
      if (e.target.closest('.return')) return;
      card.classList.toggle('expanded');
      const s = state.cards[poet.id];
      if (s && s.onMap) { s.expanded = card.classList.contains('expanded'); saveState(); }
    });
    card.querySelector('.return').addEventListener('click', (e) => {
      e.stopPropagation();
      placeInTray(poet.id);
    });
    attachDrag(card, poet.id);
    return card;
  }

  function getCardEl(id) {
    return document.querySelector(`.card[data-id="${id}"]`);
  }

  function placeOnMap(id, x, y, expanded) {
    const card = getCardEl(id);
    if (!card) return;
    card.classList.remove('in-tray');
    card.classList.add('on-map');
    card.style.position = '';
    card.style.width = '';
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    if (expanded) card.classList.add('expanded'); else card.classList.remove('expanded');
    stage.appendChild(card);
    card.style.transform = `scale(${1 / view.scale})`;
    state.cards[id] = { onMap: true, x, y, expanded: !!expanded };
    saveState();
  }

  function placeInTray(id) {
    const card = getCardEl(id);
    if (!card) return;
    card.classList.add('in-tray');
    card.classList.remove('on-map', 'expanded', 'dragging');
    card.style.position = '';
    card.style.width = '';
    card.style.left = '';
    card.style.top = '';
    card.style.transform = '';
    tray.appendChild(card);
    state.cards[id] = { onMap: false };
    saveState();
  }

  POETS.forEach(p => tray.appendChild(makeCard(p)));
  POETS.forEach(p => {
    const s = state.cards[p.id];
    if (s && s.onMap) placeOnMap(p.id, s.x, s.y, s.expanded);
  });

  function attachDrag(card, id) {
    let startX, startY, origLeft, origTop, dragging, fromTray, startRect;
    const onDown = (e) => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      try { card.setPointerCapture(e.pointerId); } catch (err) {}
      startX = e.clientX;
      startY = e.clientY;
      dragging = false;
      fromTray = card.classList.contains('in-tray');
      if (!fromTray) {
        origLeft = parseFloat(card.style.left) || 0;
        origTop = parseFloat(card.style.top) || 0;
      } else {
        startRect = card.getBoundingClientRect();
      }
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerup', onUp);
      card.addEventListener('pointercancel', onUp);
    };
    const onMove = (e) => {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        dragging = true;
        card.classList.add('dragging');
        if (fromTray) {
          card.style.position = 'fixed';
          card.style.left = startRect.left + 'px';
          card.style.top = startRect.top + 'px';
          card.style.width = startRect.width + 'px';
          document.body.appendChild(card);
        }
      }
      if (fromTray) {
        card.style.left = (startRect.left + dx) + 'px';
        card.style.top = (startRect.top + dy) + 'px';
        const mapRect = mapArea.getBoundingClientRect();
        const over = e.clientX >= mapRect.left && e.clientX <= mapRect.right
                  && e.clientY >= mapRect.top && e.clientY <= mapRect.bottom;
        mapArea.classList.toggle('drop-target', over);
      } else {
        card.style.left = (origLeft + dx / view.scale) + 'px';
        card.style.top = (origTop + dy / view.scale) + 'px';
      }
    };
    const onUp = (e) => {
      card.removeEventListener('pointermove', onMove);
      card.removeEventListener('pointerup', onUp);
      card.removeEventListener('pointercancel', onUp);
      try { card.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!dragging) return;
      card._justDragged = true;
      card.classList.remove('dragging');
      mapArea.classList.remove('drop-target');
      const mapRect = mapArea.getBoundingClientRect();
      const inMap = e.clientX >= mapRect.left && e.clientX <= mapRect.right
                 && e.clientY >= mapRect.top && e.clientY <= mapRect.bottom;
      if (fromTray) {
        if (inMap) {
          const cardRect = card.getBoundingClientRect();
          const localLeft = (cardRect.left - mapRect.left - view.tx) / view.scale;
          const localTop  = (cardRect.top  - mapRect.top  - view.ty) / view.scale;
          placeOnMap(id, localLeft, localTop, false);
        } else {
          placeInTray(id);
        }
      } else {
        if (inMap) {
          state.cards[id] = {
            onMap: true,
            x: parseFloat(card.style.left) || 0,
            y: parseFloat(card.style.top) || 0,
            expanded: card.classList.contains('expanded')
          };
          saveState();
        } else {
          placeInTray(id);
        }
      }
    };
    card.addEventListener('pointerdown', onDown);
  }

  const MIN_SCALE = 0.1;
  const MAX_SCALE = 8;

  function zoomAt(clientX, clientY, factor) {
    const rect = mapArea.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
    const actualFactor = newScale / view.scale;
    view.tx = px - (px - view.tx) * actualFactor;
    view.ty = py - (py - view.ty) * actualFactor;
    view.scale = newScale;
    applyTransform();
    persistView();
  }

  mapArea.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  const activePointers = new Map();
  let panState = null;
  let pinchState = null;

  mapArea.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.card')) return;
    if (e.target.closest('button')) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { mapArea.setPointerCapture(e.pointerId); } catch (err) {}
    if (activePointers.size === 1) {
      panState = { startX: e.clientX, startY: e.clientY, tx: view.tx, ty: view.ty, pointerId: e.pointerId };
      pinchState = null;
    } else if (activePointers.size === 2) {
      panState = null;
      const pts = [...activePointers.values()];
      pinchState = {
        dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        mid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }
      };
    }
  });

  mapArea.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchState && activePointers.size === 2) {
      const pts = [...activePointers.values()];
      const newDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const newMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      if (pinchState.dist > 0) zoomAt(newMid.x, newMid.y, newDist / pinchState.dist);
      pinchState.dist = newDist;
      pinchState.mid = newMid;
    } else if (panState && panState.pointerId === e.pointerId) {
      view.tx = panState.tx + (e.clientX - panState.startX);
      view.ty = panState.ty + (e.clientY - panState.startY);
      applyTransform();
    }
  });

  const endPointer = (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.delete(e.pointerId);
    if (panState && panState.pointerId === e.pointerId) {
      panState = null;
      persistView();
    }
    if (activePointers.size < 2 && pinchState) {
      pinchState = null;
      persistView();
    }
    if (activePointers.size === 1 && !panState) {
      const [pid, pt] = [...activePointers.entries()][0];
      panState = { startX: pt.x, startY: pt.y, tx: view.tx, ty: view.ty, pointerId: pid };
    }
  };
  mapArea.addEventListener('pointerup', endPointer);
  mapArea.addEventListener('pointercancel', endPointer);

  document.getElementById('zoom-in').addEventListener('click', () => {
    const r = mapArea.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    const r = mapArea.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25);
  });
  document.getElementById('zoom-fit').addEventListener('click', fitMap);
  document.getElementById('reset-view').addEventListener('click', fitMap);
  document.getElementById('recall-all').addEventListener('click', () => {
    POETS.forEach(p => placeInTray(p.id));
  });

  function fitMap() {
    const r = mapArea.getBoundingClientRect();
    if (!mapImg.naturalWidth) return;
    const scale = Math.min(r.width / mapImg.naturalWidth, r.height / mapImg.naturalHeight) * 0.98;
    view.scale = scale;
    view.tx = (r.width - mapImg.naturalWidth * scale) / 2;
    view.ty = (r.height - mapImg.naturalHeight * scale) / 2;
    applyTransform();
    persistView();
  }

  function maybeFit() {
    if (!state.view) fitMap();
  }
  if (mapImg.complete && mapImg.naturalWidth) maybeFit();
  else mapImg.addEventListener('load', maybeFit);
  window.addEventListener('resize', () => { /* keep current view; no auto-refit */ });
</script>
</body>
</html>
